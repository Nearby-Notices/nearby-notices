name: deploy

# After the image workflow has published a new image for a push to main, point the Container App at it.
# Secrets: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID (a service principal with Contributor on the
# resource group only), AZURE_SUBSCRIPTION_ID.
on:
  workflow_run:
    workflows: [image]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time: two pushes close together used to start two deploys, and the second failed with
# ContainerAppOperationInProgress (incident of 23/10/2026). Queued runs wait; none is cancelled.
concurrency:
  group: deploy-nearby-notices
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'
      - name: Roll the app to the image for this commit
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          for attempt in 1 2 3 4 5; do
            if az containerapp update -n nearby-notices -g nearby-notices --image "ghcr.io/OWNER/nearby-notices:${sha}" -o none; then
              echo "deployed ${sha}"; exit 0
            fi
            echo "update refused (attempt ${attempt}); waiting for any operation in progress"; sleep 30
          done
          exit 1
