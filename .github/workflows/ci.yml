name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check nearby_notices tests evals
      - run: uv run pytest -q
        env:
          NN_MODEL: openai/ci-no-model          # tests never call a model; this keeps the name honest if one slips through
          NN_MODEL_API_BASE: http://127.0.0.1:9/v1
      - name: Infrastructure as code compiles and lints
        run: az bicep build -f infra/main.bicep --stdout > /dev/null
