[project]
name = "nearby-notices"
version = "0.1.0"
description = "Public notices from The Gazette near a UK postcode, in plain English, as a website and an MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.105.1",
    "mcp>=1.2",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
evals = [
    "azure-ai-inference>=1.0.0b9",
    "dvc>=3.50",
    "inspect-ai>=0.3.282",
    "inspect-quote-check",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "packages/inspect_quote_check",
]

[tool.uv.sources]
inspect-quote-check = { workspace = true, editable = true }
