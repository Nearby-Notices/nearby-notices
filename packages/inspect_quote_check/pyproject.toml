[project]
name = "inspect-quote-check"
version = "0.1.0"
description = "An Inspect scorer that keeps a model's claim only if every quote it offers is really in the source and every number in the claim appears in those quotes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["inspect_ai>=0.3"]

[project.entry-points.inspect_ai]
inspect_quote_check = "inspect_quote_check._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_quote_check"]
